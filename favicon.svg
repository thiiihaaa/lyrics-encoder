<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- background rounded rect -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- music note shape -->
  <g fill="url(#pink)">
    <!-- note head -->
    <ellipse cx="22" cy="46" rx="7" ry="5" transform="rotate(-15 22 46)"/>
    <!-- note stem -->
    <rect x="27.5" y="16" width="3.5" height="31" rx="1.75"/>
    <!-- note flag / beam -->
    <path d="M31 16 Q48 20 46 32 Q44 24 31 22 Z"/>
    <!-- text lines (lyrics) -->
    <rect x="36" y="38" width="14" height="2.5" rx="1.25" opacity=".9"/>
    <rect x="36" y="43" width="10" height="2.5" rx="1.25" opacity=".7"/>
    <rect x="36" y="48" width="12" height="2.5" rx="1.25" opacity=".5"/>
  </g>
</svg>
